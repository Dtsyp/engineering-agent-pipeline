name: Validate engineering pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/pipeline.py profile show max-quality

  host-cli:
    name: Installed host CLI (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: opencode
            package: '@opencode/cli@2'
          - host: claude
            package: '@anthropic-ai/claude-code@latest'
          - host: codex
            package: '@openai/codex@latest'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global "${{ matrix.package }}"
      - run: python tools/pipeline.py install --target "${{ matrix.host }}"
      - run: python tools/pipeline.py doctor --target "${{ matrix.host }}"
        timeout-minutes: 3
